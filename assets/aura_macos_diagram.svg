<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">Aura — macOS Meeting Intelligence Architecture</text>
  <text x="480" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Native ScreenCaptureKit audio loopback, real-time streaming speech transcription, and local on-device AI memory</text>

  <!-- Card 1: Dual Audio Capture -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="210" height="290" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#blueGrad)" />
    <rect y="26" width="210" height="12" fill="url(#blueGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Dual Audio Capture</text>

    <rect x="14" y="55" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" fill="#38bdf8" font-size="12" font-weight="600">ScreenCaptureKit</text>
    <text x="24" y="90" fill="#94a3b8" font-size="10">System audio loopback</text>

    <rect x="14" y="111" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="130" fill="#f8fafc" font-size="12" font-weight="600">AVAudioEngine</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">Microphone tap & VAD</text>

    <rect x="14" y="167" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="186" fill="#f8fafc" font-size="12" font-weight="600">AudioMixer Actor</text>
    <text x="24" y="202" fill="#94a3b8" font-size="10">PCM resampler & normalizer</text>

    <rect x="14" y="223" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="242" fill="#f8fafc" font-size="12" font-weight="600">Circular Buffer</text>
    <text x="24" y="258" fill="#94a3b8" font-size="10">Zero-retention ring buffer</text>
  </g>

  <!-- Card 2: Transcription Engine -->
  <g transform="translate(260, 95)" filter="url(#shadow)">
    <rect width="210" height="290" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#purpleGrad)" />
    <rect y="26" width="210" height="12" fill="url(#purpleGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Streaming Transcription</text>

    <rect x="14" y="55" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" fill="#c084fc" font-size="12" font-weight="600">Local Provider</text>
    <text x="24" y="90" fill="#94a3b8" font-size="10">On-device Apple Speech</text>

    <rect x="14" y="111" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="130" fill="#f8fafc" font-size="12" font-weight="600">Cloud Whisper</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">Chunked HTTP streaming</text>

    <rect x="14" y="167" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="186" fill="#f8fafc" font-size="12" font-weight="600">Speaker Diarization</text>
    <text x="24" y="202" fill="#94a3b8" font-size="10">Turn detection & tags</text>

    <rect x="14" y="223" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="242" fill="#f8fafc" font-size="12" font-weight="600">Segment Assembly</text>
    <text x="24" y="258" fill="#94a3b8" font-size="10">Timecoded transcript blocks</text>
  </g>

  <!-- Card 3: AI Intelligence -->
  <g transform="translate(490, 95)" filter="url(#shadow)">
    <rect width="210" height="290" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#emeraldGrad)" />
    <rect y="26" width="210" height="12" fill="url(#emeraldGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">AI Intelligence Core</text>

    <rect x="14" y="55" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" fill="#34d399" font-size="12" font-weight="600">Grounded Synthesis</text>
    <text x="24" y="90" fill="#94a3b8" font-size="10">Source-linked summaries</text>

    <rect x="14" y="111" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="130" fill="#f8fafc" font-size="12" font-weight="600">Action Item Tracker</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">Owner & deadline extraction</text>

    <rect x="14" y="167" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="186" fill="#f8fafc" font-size="12" font-weight="600">Local CoreML LLM</text>
    <text x="24" y="202" fill="#94a3b8" font-size="10">Zero-cloud local inference</text>

    <rect x="14" y="223" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="242" fill="#f8fafc" font-size="12" font-weight="600">Interactive Chat</text>
    <text x="24" y="258" fill="#94a3b8" font-size="10">Ask questions over meeting</text>
  </g>

  <!-- Card 4: Native macOS App -->
  <g transform="translate(720, 95)" filter="url(#shadow)">
    <rect width="210" height="290" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#amberGrad)" />
    <rect y="26" width="210" height="12" fill="url(#amberGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">macOS Experience</text>

    <rect x="14" y="55" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" fill="#fbbf24" font-size="12" font-weight="600">SwiftUI & AppKit</text>
    <text x="24" y="90" fill="#94a3b8" font-size="10">Clean 3-column macOS window</text>

    <rect x="14" y="111" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="130" fill="#f8fafc" font-size="12" font-weight="600">MenuBarExtra</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">Global hotkey & quick toggle</text>

    <rect x="14" y="167" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="186" fill="#f8fafc" font-size="12" font-weight="600">SwiftData Storage</text>
    <text x="24" y="202" fill="#94a3b8" font-size="10">Local SQLite & FTS5 search</text>

    <rect x="14" y="223" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="242" fill="#f8fafc" font-size="12" font-weight="600">Keychain Vault</text>
    <text x="24" y="258" fill="#94a3b8" font-size="10">Encrypted user credentials</text>
  </g>

  <!-- Connectors -->
  <path d="M 240 240 L 260 240" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M 470 240 L 490 240" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M 700 240 L 720 240" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Footer Pills -->
  <g transform="translate(160, 404)">
    <rect width="135" height="22" rx="6" fill="#1e293b" />
    <text x="67" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">ScreenCaptureKit API</text>
  </g>
  <g transform="translate(315, 404)">
    <rect width="145" height="22" rx="6" fill="#1e293b" />
    <text x="72" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">Zero Audio Retention</text>
  </g>
  <g transform="translate(480, 404)">
    <rect width="135" height="22" rx="6" fill="#1e293b" />
    <text x="67" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">SwiftData + SQLite</text>
  </g>
  <g transform="translate(635, 404)">
    <rect width="155" height="22" rx="6" fill="#1e293b" />
    <text x="77" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">macOS 14.0+ (Sonoma+)</text>
  </g>
</svg>
